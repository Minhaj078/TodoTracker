<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <title>ToDo App</title>
</head>
<body>
  <div class="sidebar">
    <h2>ToDo</h2>
    <div class="menu-item">Dashboard</div>
    <h3 class="history-heading">History</h3>
    <ul id="historyList" class="history-list"></ul>

    <div class="menu-item logout-button" onclick="logoutUser()">Logout</div>
  </div>

  <div class="content" id="mainAppContent" style="display: none;">
    <div class="breadcrumbs">Dashboard > Overview</div>
    <div class="header">
      <h2>My Todo</h2>
      <button onclick="showTaskForm()">+ New Task</button>
    </div>

    <div class="search-section">
      <input
        type="text"
        placeholder="Search"
        id="searchBox"
        oninput="searchTasks()"
      />
    </div>

    <div class="columns">
      <div class="column" id="toStart">
        <h3><span class="dot teal"></span> To Start</h3>
        <div class="add-new" onclick="showTaskForm('toStart')">+ Add New</div>
      </div>
      <div class="column" id="inProgress">
        <h3><span class="dot orange"></span> In Progress</h3>
      </div>
      <div class="column" id="completed">
        <h3><span class="dot green"></span> Completed</h3>
      </div>
    </div>

    <h3 style="margin-top: 40px;">Weekly Habit Tracker</h3>
    <div id="habitCalendarContainer"></div>

    </div> <div id="authSection" style="display: none; margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto; padding: 20px; background: #2a2a2a; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
    <h3 style="text-align: center; color: #eee;">User Authentication</h3>

    <div style="margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 8px; background: #333;">
        <h4 style="color: #eee;">Register</h4>
        <input type="text" id="registerUsername" placeholder="Username" style="width: calc(100% - 22px); padding: 10px; margin: 8px 0; border: 1px solid #555; border-radius: 4px; background: #444; color: #eee; outline: none;" />
        <input type="email" id="registerEmail" placeholder="Email" style="width: calc(100% - 22px); padding: 10px; margin: 8px 0; border: 1px solid #555; border-radius: 4px; background: #444; color: #eee; outline: none;" />
        <input type="password" id="registerPassword" placeholder="Password" style="width: calc(100% - 22px); padding: 10px; margin: 8px 0; border: 1px solid #555; border-radius: 4px; background: #444; color: #eee; outline: none;" />
        <button type="button" onclick="registerUser()" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px;">Register</button>
    </div>

    <div style="margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 8px; background: #333;">
        <h4 style="color: #eee;">Login</h4>
        <input type="email" id="loginEmail" placeholder="Email" style="width: calc(100% - 22px); padding: 10px; margin: 8px 0; border: 1px solid #555; border-radius: 4px; background: #444; color: #eee; outline: none;" />
        <input type="password" id="loginPassword" placeholder="Password" style="width: calc(100% - 22px); padding: 10px; margin: 8px 0; border: 1px solid #555; border-radius: 4px; background: #444; color: #eee; outline: none;" />
        <button type="button" onclick="loginUser()" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px;">Login</button>
    </div>

    <button type="button" onclick="logoutUser()" style="width: 100%; padding: 10px; margin-top: 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Logout</button>
  </div>
  <div id="taskForm" style="display: none;">
      <input type="text" id="taskTitle" placeholder="Habit Name" />
      <textarea
        id="taskDesc"
        placeholder="Habit Description (optional)"
      ></textarea>
      <select id="habitTime">
        <option value="">-- Select Time --</option>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
        <option value="Night">Night</option>
      </select>
      <input type="date" id="taskDate" />
      <input type="hidden" id="editTaskId" />
      <button onclick="saveTask()">Save Habit</button>
      <button type="button" onclick="taskForm.style.display='none'; document.getElementById('overlay').style.display='none';">Cancel</button>
  </div>

  <div id="overlay" class="overlay" style="display: none;"></div>

</body>
</html>
